[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "python-web-tetris"
version = "0.1.0"
description = "A deterministic falling-block game built with Python and pygame-ce"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pygame-ce>=2.5.5,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]
web = [
    "pygbag==0.9.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E741"]
